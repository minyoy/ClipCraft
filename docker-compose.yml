services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GPU_SERVER_URL: ${GPU_SERVER_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./clipcraft-web
      dockerfile: Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_ANALYZE_API_URL: /analyze
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./clipcraft-web:/app
      - /app/node_modules
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http frontend:5173
    ports:
      - "4040:4040"
    depends_on:
      - frontend
