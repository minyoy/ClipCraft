services:
  backend:
    build:
      context: .
      dockerfile: api_server/Dockerfile
    environment:
      CLIP_SEARCH_OUTPUT_ROOT: /app/clip_search/clips
      CLIP_SEARCH_FPS: "0.5"
      CLIP_SEARCH_BATCH_SIZE: "32"
      CLIP_SEARCH_MODEL: ViT-B/32
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8001:8000"
    volumes:
      - ./clip_search:/app/clip_search
      - ./audio:/app/audio

  frontend:
    build:
      context: .
      dockerfile: clipcraft-web/Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_ANALYZE_API_URL: /analyze
      VITE_BACKEND_URL: http://backend:8000
      VITE_LOCAL_VIDEO_BASE_PATH: /app/clip_search/
    ports:
      - "5174:5173"
    volumes:
      - ./clipcraft-web:/app
      - /app/node_modules
    depends_on:
      - backend
