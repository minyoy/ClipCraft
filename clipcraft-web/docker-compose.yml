services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_ANALYZE_API_URL: /analyze
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http frontend:5173
    ports:
      - "4040:4040"
    depends_on:
      - frontend
